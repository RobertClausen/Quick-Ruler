; Deployment target: Seeed XIAO ESP32C3.
;   OLED  I2C  SDA = GPIO6, SCL = GPIO7   (XIAO default pins, NOT the
;                                          SuperMini bench rig's GPIO8/9)
;   STM32 UART   RX = GPIO20 (D7) <- STM32 PA9 (USART1_TX)
;                TX = GPIO21 (D6) -> STM32 PA10 (USART1_RX)
[env:xiao_c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv   ; BLE + U8g2 overflows the default app slot
lib_deps =
    olikraus/U8g2 @ ^2.35.30
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
